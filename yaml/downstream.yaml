epochs: 1
#steps_per_epoch: 10000
#train_encoder: True
#encoder_start: 0
#log_wandb: False
#save_weights: False
#high_score: aa_recall

##################
## Learning rate #
##################
lr_schedule: True
# Phase 1 - Warmup
lr_warmup_start: 1.0e-7
lr_warmup_end: 2.e-4 # phase 2 LR
lr_warmup_steps: 1000
# Phase 2 - Flat
lr_flat_steps: 0 #266000
# Phase 3 - Decay
lr_floor: 1.0e-5
lr_decay_steps: 1000000 # 1000000

# Loader options
loader:
